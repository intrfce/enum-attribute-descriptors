name: run-tests

on: [push, pull_request]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.5, 8.4, 8.3, 8.2]
        laravel: [11.*, 12.*, 13.*]
        testbench: [^9.1, ^10.0, ^11.0]
        dependency-version: [prefer-lowest, prefer-stable]
        include:
          - laravel: 11.*
            testbench: ^9.1
          - laravel: 12.*
            testbench: ^10.0
          - laravel: 13.*
            testbench: ^11.0
        exclude:
          - laravel: 11.*
            testbench: ^10.0
          - laravel: 11.*
            testbench: ^11.0
          - laravel: 12.*
            testbench: ^9.1
          - laravel: 12.*
            testbench: ^11.0
          - laravel: 13.*
            testbench: ^9.1
          - laravel: 13.*
            testbench: ^10.0
          # L13/Testbench 11 have no stable releases yet
          - laravel: 13.*
            dependency-version: prefer-lowest

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none

      - name: Setup Problem Matches
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          LARAVEL="${{ matrix.laravel }}"
          TESTBENCH="${{ matrix.testbench }}"
          if [[ "$LARAVEL" == "13.*" ]]; then
            LARAVEL="13.*@dev"
            TESTBENCH="${TESTBENCH}@dev"
          fi
          composer require "laravel/framework:${LARAVEL}" "orchestra/testbench:${TESTBENCH}" "nesbot/carbon:>=2.62.1" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest
